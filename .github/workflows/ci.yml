name: Continuous Integration

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          dependency-path: "studykit/backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./studykit/backend[dev]"

      - name: Run tests
        working-directory: ./studykit
        run: python -m pytest backend/tests/test_difficulty.py -v