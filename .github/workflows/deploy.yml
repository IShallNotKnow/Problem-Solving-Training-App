name: CI/CD Pipeline (Vercel Only for Now)

on:
  push:
    branches: [main]

jobs:
  vercel-deployment:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./studykit/frontend

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './studykit/frontend/package-lock.json'
        
      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel authentication
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Link Vercel Project
        run: vercel link --yes --token="$VERCEL_TOKEN"

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
