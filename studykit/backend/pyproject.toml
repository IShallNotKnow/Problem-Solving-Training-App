[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studykit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "openai==2.48.0",
    "llama-cloud==2.13.0",
    "supabase==2.31.0",
    "redis==5.3.1",
    "python-jose[cryptography]==3.5.0",
    "httpx==0.27.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "slowapi==0.1.10",
    "valkey==6.1.1",
    "arq==0.28.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
