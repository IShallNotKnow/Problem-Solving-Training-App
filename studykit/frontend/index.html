<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Studykit – AI-Powered Study Questions</title>
    <meta name="description" content="Studykit turns your lecture notes and slides into adaptive study questions. Upload a PDF or paste your notes and get started in seconds." />
    <meta name="keywords" content="study, flashcards, AI, questions, adaptive learning, exam prep, PDF, notes" />
    <meta name="author" content="Anish Appala" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.studykit.dev" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.studykit.dev" />
    <meta property="og:title" content="Studykit – AI-Powered Study Questions" />
    <meta property="og:description" content="Turn your lecture notes and slides into adaptive study questions. Upload a PDF or paste your notes and get started in seconds." />
    <meta property="og:image" content="https://www.studykit.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Studykit" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.studykit.dev" />
    <meta name="twitter:title" content="Studykit – AI-Powered Study Questions" />
    <meta name="twitter:description" content="Turn your lecture notes and slides into adaptive study questions. Upload a PDF or paste your notes and get started in seconds." />
    <meta name="twitter:image" content="https://www.studykit.dev/og-image.png" />

    <!-- Theme: must match --accent in src/styles/theme.css, not the old purple. -->
    <meta name="theme-color" content="#185fa5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- The document's real scheme is driven by [data-theme] in
         src/styles/theme.css so the scrollbar and overscroll band follow the
         in-app toggle rather than the OS preference. -->

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
